name: bazaar
description: A local-first Flutter shopping list app with barcode scanning, multi-store price tracking, AR/EN i18n, and encrypted ZIP backup.
publish_to: "none"
version: 2.0.0+8

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management & routing ──────────────────────────────────────────
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1

  # ── Database (Drift over the hooks-bundled sqlite3 3.x) ─────────────────
  # Drift gives reactive streams + compile-checked SQL. sqlite3 3.x uses Dart
  # build hooks to bundle the native library on Android/iOS/desktop, so the
  # old sqflite / sqlite3_flutter_libs packages are no longer needed.
  drift: ^2.34.4
  path: ^1.9.1
  path_provider: ^2.1.6

  # ── Barcode scanning ────────────────────────────────────────────────────
  mobile_scanner: ^7.4.0

  # ── HTTP / scraping ─────────────────────────────────────────────────────
  http: ^1.6.0
  html: ^0.15.7
  collection: ^1.19.1

  # ── Localization ────────────────────────────────────────────────────────
  # Pinned by flutter_localizations from the Flutter SDK — do not bump here.
  intl: ^0.20.2

  # ── Persistence ─────────────────────────────────────────────────────────
  shared_preferences: ^2.5.5
  # v11: Android Keystore / iOS Keychain backed secure storage for API keys.
  flutter_secure_storage: ^11.0.0

  # ── Share / import-export ───────────────────────────────────────────────
  share_plus: ^13.3.0
  file_picker: ^12.2.0
  permission_handler: ^13.0.2
  receive_sharing_intent: ^1.9.0

  # ── Backup ──────────────────────────────────────────────────────────────
  archive: ^4.2.0

  # ── UI ──────────────────────────────────────────────────────────────────
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.3
  package_info_plus: ^10.2.1

  # ── Cloud LLM providers (Tier 2) ────────────────────────────────────────
  google_generative_ai: ^0.4.7

  # ── On-device LLM (Tier 3) — MediaPipe runtime ──────────────────────────
  flutter_gemma: ^1.7.1

  # ── Cryptography: AES-256-GCM backups + SHA-256 model verification ─────
  cryptography: ^2.9.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/

  # Fonts are bundled (not fetched at runtime) so the app works fully
  # offline from first launch: Latin, Arabic, and a monospace for
  # barcodes/JSON debugging.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: AppMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
