name: bazaar
description: A local-first Flutter shopping list app with barcode scanning, multi-store price tracking, AR/EN i18n, and ZIP backup.
publish_to: "none"
version: 1.4.4+7

environment:
  sdk: ">=3.4.0 <4.0.0"
  # Match the user's installed Flutter 3.44.x. flutter_gemma 1.1.2 requires
  # Flutter >=3.44.0; share_plus 12 requires >=3.22.0. mobile_scanner is
  # pinned to 6.x (not 7.x) because 7.x has breaking controller lifecycle
  # changes that haven't been verified against this codebase.
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  path: ^1.9.1

  # Barcode scanning — bumped from 5.2.3 to 6.x for ML Kit 16+ and Android 14
  # support. Stayed on 6.x (not 7.x) because 7.x has breaking controller
  # lifecycle changes that need code changes in scanner_screen.dart.
  mobile_scanner: ^6.0.2

  # HTTP / scraping
  http: ^1.4.0
  html: ^0.15.6
  collection: ^1.19.1

  # State management
  provider: ^6.1.5

  # Localization
  intl: ^0.20.2

  # Persistence
  shared_preferences: ^2.5.3

  # Secure storage for API keys (Android Keystore / iOS Keychain).
  # v10+ pulls in flutter_secure_storage_linux 3.x which bundles a newer
  # nlohmann/json.hpp without the -Wdeprecated-literal-operator warning
  # that breaks the Linux build on Clang 16+.
  flutter_secure_storage: ^10.2.0

  # Share / Import-Export
  # share_plus ^12.x is required because flutter_gemma transitively needs
  # mime ^2.0.0 (via background_downloader). Stayed on 12.x because 13.x
  # has API changes that haven't been verified.
  share_plus: ^12.0.2
  # file_picker stayed on 8.x because 9.x+ removed the `FilePicker.platform`
  # static accessor in favour of an instance API. The codebase uses the
  # static API in two places (share_service.dart, backup_service.dart).
  file_picker: ^8.3.7
  path_provider: ^2.1.5

  # Backup — stayed on 3.x because 4.x has API changes around ArchiveFile
  # construction that need code changes in backup_service.dart. 3.6.1 is
  # already in use and works.
  archive: ^3.6.1
  permission_handler: ^12.0.1

  # Receive shared JSON from other apps — bumped from 1.8.0 to 1.9.0
  # (latest stable). 1.9.x is the highest published version; there is no 2.x.
  # Now actually wired up (Finding 6) — see MainActivity.kt and main.dart.
  receive_sharing_intent: ^1.9.0

  # UI
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  package_info_plus: ^8.3.0

  # Cloud LLM providers (Tier 2)
  # Bumped to the latest 0.4.x patch release. The 0.5.x line has breaking
  # API changes (GenerationConfig field renames) — deferred until tested.
  google_generative_ai: ^0.4.7

  # On-device LLM (Tier 3) — MediaPipe runtime.
  # Stayed on 1.1.x because 1.2.x changes the model-file registration API.
  flutter_gemma: ^1.1.2

  # ── NEW: Cryptography ────────────────────────────────────────────────────
  # Used by backup_service.dart for AES-256-GCM backup encryption (Finding 5)
  # and by on_device_llm.dart for SHA-256 model verification (Finding 9).
  cryptography: ^2.7.0
  # `crypto` is already a transitive dep of google_generative_ai but we
  # declare it explicitly so the streaming SHA-256 API is guaranteed.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/icons/
