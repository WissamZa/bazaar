pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    // Kotlin's serialization plugin is a compiler plugin and MUST match the
    // Kotlin compiler version. background_downloader (via flutter_gemma) pins
    // it at 2.1.0, which is incompatible with our Kotlin 2.2.20 compiler and
    // breaks serializer generation. Force every kotlin plugin to one version.
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith('org.jetbrains.kotlin')) {
                useVersion('2.2.20')
            }
        }
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.11.1" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
}

include ":app"
