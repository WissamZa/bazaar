<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bazaar — Scanner</title>
<style>
  :root {
    --accent: #8a7227;
    --text: #ffffff;
  }
  @page { size: 393px 852px; margin: 0; }
  html, body {
    margin: 0; padding: 0;
    width: 393px; height: 852px;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    background: #000;
  }
  .phone {
    width: 393px; height: 852px;
    background: linear-gradient(180deg, #1a1a1a 0%, #000 100%);
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }
  .statusbar {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    font-size: 14px; font-weight: 600;
    color: #fff;
  }
  .appbar {
    height: 56px;
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    background: transparent;
    color: #fff;
  }
  .appbar .title { font-size: 18px; font-weight: 600; }
  .appbar .actions { display: flex; gap: 18px; font-size: 22px; }

  /* Camera viewfinder mock */
  .viewfinder {
    flex: 1;
    background:
      radial-gradient(circle at 50% 50%, #2a2a2a 0%, #050505 100%);
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .reticle {
    width: 280px; height: 180px;
    border: 3px solid rgba(255, 255, 255, 0.85);
    border-radius: 16px;
    position: relative;
    background: linear-gradient(45deg, rgba(138,114,39,0.08), transparent);
  }
  .reticle::before, .reticle::after {
    content: '';
    position: absolute;
    left: 50%; transform: translateX(-50%);
    width: 80%; height: 2px;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
  }
  .reticle::before { top: 50%; animation: scan 2s ease-in-out infinite; }
  @keyframes scan {
    0%, 100% { transform: translate(-50%, -90px); opacity: 1; }
    50%      { transform: translate(-50%, 90px); opacity: 1; }
  }
  .reticle-corners {
    position: absolute; inset: -3px;
    pointer-events: none;
  }
  .corner {
    position: absolute; width: 24px; height: 24px;
    border-color: var(--accent); border-style: solid; border-width: 0;
  }
  .corner.tl { top: -3px; left: -3px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 16px; }
  .corner.tr { top: -3px; right: -3px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 16px; }
  .corner.bl { bottom: -3px; left: -3px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 16px; }
  .corner.br { bottom: -3px; right: -3px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 16px; }

  /* Barcode detected hint */
  .hint {
    position: absolute;
    bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.65);
    padding: 10px 18px; border-radius: 24px;
    font-size: 13px;
    backdrop-filter: blur(8px);
  }
  .hint .code { color: var(--accent); font-weight: 700; font-family: monospace; }

  .controls {
    position: absolute;
    bottom: 40px; left: 0; right: 0;
    display: flex; justify-content: center; align-items: center; gap: 32px;
  }
  .ctrl-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1.5px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #fff;
  }
  .ctrl-btn.primary {
    width: 72px; height: 72px;
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(138,114,39,0.5);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span>📶 🔋 87%</span>
  </div>
  <div class="appbar">
    <div class="title">Scan Barcode</div>
    <div class="actions"><span>💡</span><span>⌨</span></div>
  </div>
  <div class="viewfinder">
    <div class="reticle">
      <div class="reticle-corners">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
    </div>
    <div class="hint">Detected: <span class="code">6281007021234</span></div>
    <div class="controls">
      <div class="ctrl-btn">🔄</div>
      <div class="ctrl-btn primary">📸</div>
      <div class="ctrl-btn">💡</div>
    </div>
  </div>
</div>
</body>
</html>
