<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bazaar — Home</title>
<style>
  :root {
    --bg: #f5f5f4;
    --surface: #ffffff;
    --primary: #5e553c;
    --accent: #8a7227;
    --text: #22211f;
    --muted: #8c8a83;
    --border: #d2ccbc;
    --success: #459d62;
    --error: #9c443c;
  }
  @page { size: 393px 852px; margin: 0; }
  html, body {
    margin: 0; padding: 0;
    width: 393px; height: 852px;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
    color: var(--text);
    background: #000;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .phone {
    width: 393px; height: 852px;
    background: var(--bg);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* Status bar */
  .statusbar {
    height: 44px;
    background: var(--surface);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    font-size: 14px; font-weight: 600;
    color: var(--text);
  }
  .statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .statusbar .icons { letter-spacing: 2px; }
  /* App bar */
  .appbar {
    height: 56px;
    background: var(--surface);
    padding: 0 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }
  .appbar .title { font-size: 22px; font-weight: 700; color: var(--text); }
  .appbar .actions { display: flex; gap: 8px; color: var(--primary); font-size: 22px; }

  /* Content */
  .content {
    flex: 1;
    overflow: hidden;
    padding: 16px;
  }
  .greeting { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .greeting-name { font-size: 24px; font-weight: 700; color: var(--text); margin-bottom: 18px; }

  /* KPI cards */
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .kpi-card {
    background: var(--surface);
    border-radius: 14px;
    padding: 14px 12px;
    border: 1px solid var(--border);
    text-align: center;
  }
  .kpi-card .num { font-size: 24px; font-weight: 800; color: var(--primary); line-height: 1; }
  .kpi-card .label { font-size: 10px; color: var(--muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.8px; }

  /* Section title */
  .section-title {
    font-size: 11px; font-weight: 700; color: var(--accent);
    text-transform: uppercase; letter-spacing: 1.4px;
    margin: 18px 0 10px;
  }

  /* Recent list card */
  .list-card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 8px;
  }
  .list-card .name { font-size: 15px; font-weight: 600; }
  .list-card .meta { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .list-card .total { color: var(--success); font-weight: 600; }

  /* Price comparison */
  .compare-card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 14px;
  }
  .compare-card .pname { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .compare-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; }
  .compare-row .store { color: var(--text); }
  .compare-row .price { font-weight: 600; }
  .compare-row.best .price { color: var(--success); }
  .compare-row.worst .price { color: var(--error); }

  /* Bottom nav */
  .bottomnav {
    height: 70px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-around;
    padding-bottom: 10px;
  }
  .navitem {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); font-size: 11px;
  }
  .navitem.active { color: var(--primary); }
  .navitem .icon { font-size: 24px; }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right"><span>●●●●</span> <span>📶</span> <span>🔋 87%</span></span>
  </div>
  <div class="appbar">
    <div class="title">Bazaar</div>
    <div class="actions">⚙</div>
  </div>
  <div class="content">
    <div class="greeting">Good morning,</div>
    <div class="greeting-name">Wissam 👋</div>

    <div class="kpi-row">
      <div class="kpi-card"><div class="num">12</div><div class="label">Lists</div></div>
      <div class="kpi-card"><div class="num">84</div><div class="label">Items</div></div>
      <div class="kpi-card"><div class="num">7</div><div class="label">Stores</div></div>
    </div>

    <div class="section-title">Recent lists</div>
    <div class="list-card">
      <div class="name">Weekly Groceries</div>
      <div class="meta"><span>14 items · 9 checked</span><span class="total">﷼ 247.50</span></div>
    </div>
    <div class="list-card">
      <div class="name">Eid Preparation</div>
      <div class="meta"><span>22 items · 3 checked</span><span class="total">﷼ 612.00</span></div>
    </div>

    <div class="section-title">Cheapest across stores</div>
    <div class="compare-card">
      <div class="pname">Almarai Fresh Milk 1L</div>
      <div class="compare-row best"><span class="store">Panda</span><span class="price">﷼ 6.75</span></div>
      <div class="compare-row"><span class="store">Carrefour</span><span class="price">﷼ 7.25</span></div>
      <div class="compare-row worst"><span class="store">Tamimi</span><span class="price">﷼ 7.95</span></div>
    </div>
  </div>
  <div class="bottomnav">
    <div class="navitem active"><span class="icon">🏠</span>Home</div>
    <div class="navitem"><span class="icon">📦</span>Items</div>
    <div class="navitem"><span class="icon">📋</span>Lists</div>
    <div class="navitem"><span class="icon">🏬</span>Stores</div>
  </div>
</div>
</body>
</html>
